server:
  port: 8761

spring:
  application:
    name: RATING-SERVICE

eureka:
  port: 8082

  datasource:
    url: jdbc:postgresql://localhost/microservice
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  spring:
  application:
    name: HOTEL-SERVICE
# Optional logging
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    
    
    eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
#    hostname: localhost
      prefer-ip-address: true
